<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Category Collapse/Expand UI</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --border: #374151;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #0b1220, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 1100px; margin: 24px auto; padding: 0 16px 24px; }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    .hint { color: var(--muted); font-size: 0.92rem; margin-bottom: 16px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .toolbar button {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
    }
		.toolbar input[type="text"] {
			background: var(--panel-2);
			color: var(--text);
			border: 1px solid var(--border);
			padding: 8px 12px;
			border-radius: 8px;
			font-size: 0.9rem;
			min-width: 240px;
		}
    .toolbar button:hover { border-color: var(--accent); }
    .status { color: var(--muted); font-size: 0.9rem; margin: 8px 0 12px; }
    .hover-info {
      background: rgba(17, 24, 39, 0.8); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px; margin: 8px 0 12px; color: var(--muted); min-height: 44px;
      white-space: pre-wrap; word-break: break-word;
    }
    .tree {
      background: rgba(17, 24, 39, 0.8); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px; max-height: 76vh; overflow: auto;
    }
    .node { margin: 3px 0; border-left: 1px dashed rgba(156, 163, 175, 0.25); padding-left: 8px; }
    details.node > summary {
      list-style: none; cursor: pointer; padding: 6px 8px; border-radius: 8px;
      user-select: none; border: 1px solid transparent;
    }
    details.node > summary::-webkit-details-marker { display: none; }
    details.node > summary::before { content: "\25B6"; display: inline-block; width: 1.1em; color: var(--accent); }
    details.node[open] > summary::before { content: "\25BC"; }
    details.node > summary:hover { background: rgba(96, 165, 250, 0.08); border-color: rgba(96, 165, 250, 0.35); }
    .leaf { margin: 3px 0; padding: 6px 8px 6px 20px; border-radius: 8px; color: #d1d5db; white-space: pre-wrap; word-break: break-word; }
    .leaf:hover { background: rgba(148, 163, 184, 0.08); }
    .selected { outline: 1px solid rgba(96, 165, 250, 0.8); background: rgba(96, 165, 250, 0.14); }
    .main-category > summary { background: rgba(96, 165, 250, 0.08); border-color: rgba(96, 165, 250, 0.35); font-weight: 600; }
    .empty { color: var(--muted); padding: 8px; }
  </style>
</head>

		let focusedExtraText = '';
		const DEFAULT_INFO_TEXT = 'Hover an option to see text that appears after —.';

		function encodeFocusPath(path) {
			return path.split('>').map((part) => encodeURIComponent(part.trim())).join('%3E');
		}

		function getTitleAndExtra(line) {
			const match = line.match(/^(.*?)\s+(?:\u2014|â€"|Ã¢â‚¬â€|--)\s+(.+)$/);
			let title = match ? match[1].trim() : line.trim();
			let extra = match ? match[2].trim() : '';

			const parentheticalChunks = (title.match(/\([^)]*\)/g) || []).map((chunk) => chunk.trim());
			const parentheticalExtra = parentheticalChunks.join(' ');

			title = title.replace(/\s*\([^)]*\)/g, '').replace(/\s{2,}/g, ' ').trim();

			if (parentheticalExtra) {
				extra = extra ? `${parentheticalExtra} — ${extra}` : parentheticalExtra;
			}

			return { title, extra };
		}

    function setHoverInfo(text) {
			hoverInfo.textContent = text || focusedExtraText || DEFAULT_INFO_TEXT;
    }

    function setFocusedElement(el) {
      if (focusedElement) focusedElement.classList.remove('selected');
      focusedElement = el;
      if (focusedElement) focusedElement.classList.add('selected');
			focusedExtraText = focusedElement?.dataset?.extra || '';
			setHoverInfo(focusedExtraText);
		}

		function getPathFromFocusedElement() {
			if (!focusedElement) return '';
			return focusedElement.dataset.path || '';
		}

		function isOptionsPlaceholder(label) {
			return /^<\s*[^>]*\boptions?\b[^>]*>?$/i.test(label.trim());
		}

		function normalizePathForCopy(path) {
			const segments = path.split('>').map((part) => part.trim()).filter(Boolean);
			if (segments.length > 1 && isOptionsPlaceholder(segments[segments.length - 1])) {
				segments.pop();
			}
			return segments.join('>');
    }

		async function copyFocusLink() {
			const path = normalizePathForCopy(getPathFromFocusedElement());
			if (!path) {
				statusEl.textContent = 'You are not focusing any command.';
				return;
			}

			const link = `https://stand.sh/focus#${encodeFocusPath(path)}`;
			focusLinkAnchor.href = link;
			focusLinkAnchor.textContent = path.split('>').map((part) => part.trim()).join(' > ');
			focusLinkAnchor.title = link;
			focusLinkWrap.style.display = '';

			try {
				await navigator.clipboard.writeText(link);
				statusEl.textContent = `Copied focus link for: ${path}`;
			} catch {
				statusEl.textContent = `Clipboard access blocked. Focus link available below.`;
			}
    }

    function parseIndentedText(text) {
      const lines = text.split('\n');
      const root = [];
      const stack = [];

      lines.forEach((line) => {
        if (!line.trim()) return;
        const indent = line.search(/\S/);
				const content = line.trim();
				const { title, extra } = getTitleAndExtra(content);
				if (!title) return;

        while (stack.length > 0 && stack[stack.length - 1].indent >= indent) {
          stack.pop();
        }

				const node = { title, extra, indent, children: [] };
        if (stack.length === 0) {
          root.push(node);
        } else {
          stack[stack.length - 1].children.push(node);
        }
        stack.push(node);
      });

      return root;
    }

		function createNodeElement(node, depth = 0, parentPathParts = []) {
			const currentPathParts = [...parentPathParts, node.title];

			if (!node.children.length) {
				const leaf = document.createElement('div');
				leaf.className = 'leaf';
				leaf.textContent = node.title;
				leaf.dataset.path = currentPathParts.join('>');
				leaf.dataset.extra = node.extra || '';
				leaf.addEventListener('mouseenter', () => setHoverInfo(node.extra));
				leaf.addEventListener('mouseleave', () => setHoverInfo(focusedExtraText));
				leaf.addEventListener('click', (event) => {
					event.stopPropagation();
					setFocusedElement(leaf);
				});
				return leaf;
			}

			const details = document.createElement('details');
			details.className = 'node';
			if (depth === 0) {
				details.classList.add('main-category');
				currentMainCount++;
			}

			const summary = document.createElement('summary');
			summary.textContent = node.title;
			summary.dataset.path = currentPathParts.join('>');
			summary.dataset.extra = node.extra || '';
			summary.addEventListener('mouseenter', () => setHoverInfo(node.extra));
			summary.addEventListener('mouseleave', () => setHoverInfo(focusedExtraText));
			summary.addEventListener('click', (event) => {
				event.stopPropagation();
				setFocusedElement(summary);
			});
			details.appendChild(summary);

			for (const child of node.children) {
				details.appendChild(createNodeElement(child, depth + 1, currentPathParts));
			}

			return details;
		}

		function renderTree(nodes) {
			treeEl.innerHTML = '';
			if (!nodes.length) {
				treeEl.innerHTML = '<div class="empty">No categories found in embedded data.</div>';
				currentMainCount = 0;
				return;
			}

			for (const node of nodes) {
				treeEl.appendChild(createNodeElement(node, 0));
			}
    }

    function setOpen(selector, open) {
      treeEl.querySelectorAll(selector).forEach((el) => {
        el.open = open;
      });
    }

		function filterTreeByTerm(rawTerm) {
			const term = (rawTerm || '').trim().toLowerCase();
			const allItems = treeEl.querySelectorAll('details.node, .leaf');

			if (!term) {
				allItems.forEach((el) => {
					el.style.display = '';
				});
				return;
			}

			function filterElement(element) {
				if (element.classList.contains('leaf')) {
					const match = element.textContent.toLowerCase().includes(term);
					element.style.display = match ? '' : 'none';
					return match;
				}

				if (!element.matches('details.node')) return false;

				const summary = element.querySelector(':scope > summary');
				const selfMatch = (summary?.textContent || '').toLowerCase().includes(term);
				let childMatch = false;

				Array.from(element.children).forEach((child) => {
					if (child === summary || !(child instanceof HTMLElement)) return;
					if (filterElement(child)) {
						childMatch = true;
					}
				});

				const visible = selfMatch || childMatch;
				element.style.display = visible ? '' : 'none';
				if (visible) {
					element.open = childMatch || selfMatch;
				}

				return visible;
			}

			Array.from(treeEl.children).forEach((child) => {
				if (!(child instanceof HTMLElement)) return;
				filterElement(child);
			});
		}

		function loadText(text, sourceName = 'Embedded Data') {
			const tree = parseIndentedText(text);
			currentMainCount = 0;
			renderTree(tree);
      const sevenCheck = currentMainCount === 7
        ? 'Detected exactly 7 main categories.'
        : `Detected ${currentMainCount} main categories (expected 7).`;
      statusEl.textContent = `Loaded ${sourceName}. ${sevenCheck}`;
    }

		function extractEmbeddedTreeTextFromHtml(html) {
			const match = html.match(/const\s+EMBEDDED_TREE_TEXT\s*=\s*`([\s\S]*?)`;\s*/);
			return match ? match[1] : '';
		}

		async function init() {
			const fallbackText = EMBEDDED_TREE_TEXT;
			const rawUrl = 'https://raw.githubusercontent.com/Lenalein2001/Stand-Support-tools/senpai/StandFocusLinks/Stand%20Focus%20Links.html';

			try {
				const response = await fetch(rawUrl, { cache: 'no-store' });
				if (!response.ok) throw new Error(`HTTP ${response.status}`);
				const html = await response.text();
				const extractedText = extractEmbeddedTreeTextFromHtml(html);
				if (!extractedText) throw new Error('Could not extract EMBEDDED_TREE_TEXT');
				loadText(extractedText, 'Embedded Data (GitHub)');
			} catch (error) {
				console.warn('Falling back to local embedded text:', error);
				loadText(fallbackText, 'Embedded Data (Fallback)');
			}

			setFocusedElement(null);
			setHoverInfo('');
		}

		init();

		searchInput.addEventListener('input', () => filterTreeByTerm(searchInput.value));
		clearSearchBtn.addEventListener('click', () => {
			searchInput.value = '';
			filterTreeByTerm('');
			searchInput.focus();
		});

		document.addEventListener('keydown', (event) => {
			if (event.ctrlKey && event.key.toLowerCase() === 'f') {
				event.preventDefault();
				searchInput.focus();
				searchInput.select();
			}
		});

    expandMainBtn.addEventListener('click', () => setOpen('details.main-category', true));
    collapseMainBtn.addEventListener('click', () => setOpen('details.main-category', false));
    expandAllBtn.addEventListener('click', () => setOpen('details.node', true));
    collapseAllBtn.addEventListener('click', () => setOpen('details.node', false));
    copyFocusLinkBtn.addEventListener('click', copyFocusLink);
  </script>
</body>
</html>
